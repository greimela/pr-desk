<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PR desk</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><div class="brand"><span class="mark">⑂</span><strong>PR desk</strong></div><div class="sync"><span class="identity" id="identity">GitHub</span><span id="sync">Connecting to GitHub…</span><button id="refresh">↻ Refresh</button></div></header><main><div id="error" role="alert"></div><div class="toolbar"><nav id="repositories" aria-label="Repositories"></nav><input id="search" type="search" aria-label="Search branches and pull requests" placeholder="Search title, branch, or #…"></div><div id="filters" class="filters"><button class="active" data-filter="all">All open</button><button data-filter="attention">Needs attention</button><button data-filter="failed">Failing checks</button><button data-filter="comments">Open discussions</button><button data-filter="approved">Approved</button></div><div id="content"><div class="empty">Loading pull requests…</div></div></main><dialog id="detail"><div id="detail-content"></div></dialog></body></html>
